{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0 rounded-3">
            <h4 class="fw-bold mb-3">Reset Teacher Password</h4>
            
            {% if error %}
                <div class="alert alert-danger py-2 fs-6">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Security Question</label>
                    <p class="text-muted small mb-2">What is the admin secret keyword?</p>
                    <input type="text" name="security_answer" class="form-control" placeholder="Enter answer" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Update Password</button>
            </form>

            <div class="text-center">
                <a href="/teacher/login" class="text-decoration-none small">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
