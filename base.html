<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Assessment Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-0 border-bottom border-secondary">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/">Assessment Tool</a>
            <div>
                {% if session.get('is_teacher') %}
                    <a class="btn btn-outline-warning me-2" href="/teacher">Teacher Dashboard</a>
                    <a class="btn btn-danger me-2" href="/logout">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light me-2" href="/teacher/login">Teacher Access</a>
                {% endif %}
                <a class="btn btn-primary" href="/student">Student Portal</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-0">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS for Collapse functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
